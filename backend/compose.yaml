services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-desyr}
      MYSQL_USER: ${MYSQL_USER:-desyr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-desyr}
      MYSQL_USER: ${MYSQL_USER:-desyr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_HOST: db
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "0"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-desyr}
      MYSQL_USER: ${MYSQL_USER:-desyr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_HOST: db
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "0"
    command: ["celery", "-A", "desyr_backend", "worker", "--loglevel=INFO"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  scheduler:
    build: .
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-desyr}
      MYSQL_USER: ${MYSQL_USER:-desyr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
    command: ["celery", "-A", "desyr_backend", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mysql-data:
